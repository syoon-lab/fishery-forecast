<style>
  :root{
    --bg:#e9f0f4; --surface:#ffffff; --surface-2:#f4f8fb; --ink:#14242f; --muted:#5d7383;
    --line:#d8e2e9; --accent:#0d7d8a; --official:#245a8d; --demo:#d5842a;
    --reg-SS:#2e6fb0; --reg-ES:#c26140; --reg-WS:#4c9e6a;
    --seq-lo:#e7eff6; --seq-hi:#0a3f66; --div-neg:#c56a2c; --div-pos:#1f8f9c; --div-mid:#eef2f4;
    --land:#e6e1d9; --coast:#9aa8b2;
    --shadow:0 1px 2px rgba(20,40,55,.06),0 8px 24px rgba(20,40,55,.06);
    --font-sans:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',system-ui,-apple-system,sans-serif;
    --font-mono:ui-monospace,'SF Mono','Menlo','Consolas',monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a141d; --surface:#122130; --surface-2:#0e1b27; --ink:#e2edf4; --muted:#8aa0b0;
      --line:#1e3344; --accent:#43c0cf; --official:#4a90c8; --demo:#e6a250;
      --reg-SS:#4a90cf; --reg-ES:#d67e5c; --reg-WS:#5fb488;
      --seq-lo:#123048; --seq-hi:#66cde8; --div-neg:#e29a55; --div-pos:#43c0cf; --div-mid:#1b2c3b;
      --land:#1b2a37; --coast:#4c6373;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#e9f0f4; --surface:#ffffff; --surface-2:#f4f8fb; --ink:#14242f; --muted:#5d7383;
    --line:#d8e2e9; --accent:#0d7d8a; --official:#245a8d; --demo:#d5842a;
    --reg-SS:#2e6fb0; --reg-ES:#c26140; --reg-WS:#4c9e6a;
    --seq-lo:#e7eff6; --seq-hi:#0a3f66; --div-neg:#c56a2c; --div-pos:#1f8f9c; --div-mid:#eef2f4;
    --land:#e6e1d9; --coast:#9aa8b2;
    --shadow:0 1px 2px rgba(20,40,55,.06),0 8px 24px rgba(20,40,55,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0a141d; --surface:#122130; --surface-2:#0e1b27; --ink:#e2edf4; --muted:#8aa0b0;
    --line:#1e3344; --accent:#43c0cf; --official:#4a90c8; --demo:#e6a250;
    --reg-SS:#4a90cf; --reg-ES:#d67e5c; --reg-WS:#5fb488;
    --seq-lo:#123048; --seq-hi:#66cde8; --div-neg:#e29a55; --div-pos:#43c0cf; --div-mid:#1b2c3b;
      --land:#1b2a37; --coast:#4c6373;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  .wrap{font-family:var(--font-sans);color:var(--ink);background:var(--bg);
    min-height:100vh;padding:clamp(14px,3vw,30px);line-height:1.5;
    -webkit-font-smoothing:antialiased;letter-spacing:-.002em}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);display:flex;align-items:center;gap:10px}
  /* 공식 로고는 흰 배경 원본이라 다크 테마에서 흰 박스가 된다 → 흰 판을 깔아 감싼다.
     (색을 반전하거나 배경을 뚫으면 공식 표장을 임의 변형하는 것이 되므로 하지 않는다) */
  .eyebrow img{height:26px;width:auto;display:block;background:#fff;
    padding:3px 5px;border-radius:4px}
  .eyebrow img:not([hidden])+#org{font-size:0}   /* 로고가 있으면 기관명 텍스트는 숨김 */
  .eyebrow img:not([hidden])+#org::after{content:'AI 어황 예보';font-size:11px}
  a{color:var(--accent)}

  /* header */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
    max-width:1180px;margin:0 auto 20px;flex-wrap:wrap}
  .brand h1{font-size:clamp(20px,2.6vw,27px);font-weight:800;margin:.1em 0 0;text-wrap:balance;letter-spacing:-.02em}
  .brand .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .head-right{display:flex;align-items:center;gap:10px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
    padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--demo) 16%,transparent);
    color:var(--demo);border:1px solid color-mix(in srgb,var(--demo) 35%,transparent);letter-spacing:.02em}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--demo)}
  .tbtn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    width:38px;height:34px;border-radius:9px;font-size:15px;display:grid;place-items:center}
  .tbtn:hover{color:var(--ink);border-color:var(--accent)}

  .grid{max-width:1180px;margin:0 auto;display:grid;gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:16px 18px}
  /* 유동 타이포: 폰에서 읽히는 하한을 두고 넓은 화면에서 완만히 커진다.
     (뷰포트 비례로만 잡으면 폰에서 더 작아지고 큰 모니터에서 과해진다) */
  .card h2{font-size:clamp(14px,1.15vw,17px);font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
  .card .note{font-size:clamp(12px,0.95vw,13.5px);color:var(--muted);margin:0 0 12px}

  /* stat tiles */
  .tiles{grid-template-columns:repeat(3,1fr);width:100%;margin:0}   /* auto 마진 상속 차단(위 .three 주석 참조) */
  @media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
  /* 폰(≤480px)에서 2열이면 타일 내용폭이 ~144px 로 좁아 어장명이 여러 줄로 깨진다 → 1열 */
  @media(max-width:480px){.tiles{grid-template-columns:1fr}}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
  .tile .lab{font-size:clamp(11.5px,0.9vw,13px);color:var(--muted);font-weight:600;letter-spacing:.02em}
  .tile .big{font-family:var(--font-mono);font-variant-numeric:tabular-nums;
    font-size:clamp(21px,2.5vw,27px);font-weight:600;line-height:1.05;letter-spacing:-.02em}
  .tile .sub{font-size:clamp(12px,0.95vw,13.5px);color:var(--muted)}
  .tile.official{border-top:3px solid var(--official)}
  .tile.demo{border-top:3px solid var(--demo)}
  .tile .big.acc{color:var(--official)} .tile .big.dem{color:var(--demo)}
  /* 핵심 어장은 구역명 2개가 병기돼 길다 — 줄바꿈 허용하고 글자를 줄인다 */
  #gndbig{font-size:15px !important;line-height:1.35;white-space:normal;word-break:keep-all}
  #gndbig .gz{display:block}

  .main{grid-template-columns:1.5fr 1fr}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  /* 월별·권역별·해구별·방법과 검증 **네 블록 모두 같은 폭**(한 열).
     2·3열로 나누면 블록마다 폭이 달라져 좌우 선이 어긋난다. 세로로 길어지는 대신 정렬이 맞는다. */
  /* ⚠️ .grid 의 margin:0 auto 가 그리드 아이템에서 stretch 를 이겨 내용 폭으로 줄어든다.
     (auto 마진이 stretch 보다 우선) → 폭을 명시해야 형제 섹션과 선이 맞는다. */
  .three{grid-template-columns:1fr;width:100%;margin:0}
  .mapbox svg.map{max-width:820px;margin:0 auto}
  .mapbox .legend{max-width:820px;margin-left:auto;margin-right:auto}
  .col{display:grid;gap:14px;align-content:start}

  /* segmented */
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{font-family:inherit;font-size:clamp(12.5px,1vw,14px);font-weight:600;color:var(--muted);cursor:pointer;
    border:0;background:transparent;padding:6px 11px;border-radius:7px;letter-spacing:-.01em}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  :root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#20374a}
  .maprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  /* 지도 카드는 제목·설명과 뷰 선택을 항상 다른 줄에 둔다 — 뷰 라벨이 길어 한 줄에 넣으면
     설명이 눌리고 버튼이 잘린다. */
  .maprow.stack{flex-direction:column;align-items:stretch;gap:8px}
  .maprow.stack .seg{align-self:flex-start}

  /* map */
  .mapbox{position:relative}
  svg.map{width:100%;height:auto;display:block;border-radius:10px;background:var(--surface-2)}
  svg.map rect.cell{stroke:color-mix(in srgb,var(--ink) 12%,transparent);stroke-width:.4;
    transition:opacity .12s;cursor:crosshair}
  svg.map rect.cell:hover{stroke:var(--ink);stroke-width:1.1}
  svg.map path.land{fill:var(--land);stroke:var(--coast);stroke-width:.5;
    stroke-linejoin:round;pointer-events:none}
  .grat{stroke:color-mix(in srgb,var(--muted) 26%,transparent);stroke-width:.5;stroke-dasharray:2 3}
  .grat-t{fill:var(--muted);font-size:9px;font-family:var(--font-mono)}
  .tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-8px);
    background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:11.5px;
    line-height:1.45;white-space:nowrap;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.28);transition:opacity .1s}
  .tip .mono{font-size:11.5px}
  .legend{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:clamp(11.5px,0.9vw,13px);color:var(--muted)}
  .legbar{height:11px;flex:1;border-radius:6px;border:1px solid var(--line);max-width:230px}
  .legend .mono{font-size:clamp(11.5px,0.9vw,13px);color:var(--ink)}

  /* bars */
  .bars{display:grid;gap:9px}
  .bar-row{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:10px;font-size:clamp(12.5px,1vw,14.5px)}
  .bar-row .rl{color:var(--muted);font-weight:600}
  .track{background:var(--surface-2);border-radius:6px;height:22px;overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;border-radius:5px 0 0 5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .bar-row .val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;min-width:46px;text-align:right}
  .vbar-note{font-size:clamp(11.5px,0.9vw,13px);color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .kpi-line{position:relative}
  .thresh{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--demo);opacity:.7}

  /* monthly */
  .mgrp{border-top:1px dashed var(--line);padding-top:9px;display:grid;gap:5px}
  .mgrp:first-child{border-top:0;padding-top:0}
  /* 헤더를 .mrow 와 **같은 3열 그리드**로 두고 빈 칸(.msp)까지 맞춘다.
     그래야 비교율이 막대(트랙) 열의 정가운데에 정렬된다. 세로로는 막대 위쪽 줄. */
  .mhead{display:grid;grid-template-columns:56px 1fr auto;gap:9px;align-items:baseline;
    font-size:clamp(13px,1.05vw,15.5px);margin-bottom:3px}
  .mhead .msp{min-width:clamp(44px,4vw,62px)}
  .mhead .cmp{justify-self:center;font-family:var(--font-mono);font-size:clamp(11px,0.9vw,13px);
    font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .mhead .cmp i{font-style:normal}
  .mhead .cmp i.up{color:var(--reg-WS)} .mhead .cmp i.dn{color:var(--reg-ES)}
  .mhead .cmp i.mut{color:var(--muted)}
  .myoy{font-size:11px;font-family:var(--font-mono);font-weight:600}
  .myoy.dn{color:var(--reg-ES)} .myoy.up{color:var(--reg-WS)}
  .mrow{display:grid;grid-template-columns:clamp(56px,5vw,74px) 1fr auto;align-items:center;gap:9px;font-size:clamp(12px,0.95vw,14px)}
  .mrow .ml{color:var(--muted);font-weight:600;font-size:clamp(12px,0.95vw,14px)}
  .mrow .track{height:16px}
  .mrow .val{font-family:var(--font-mono);font-variant-numeric:tabular-nums;min-width:clamp(44px,4vw,62px);text-align:right;font-size:clamp(12px,0.95vw,14px)}

  /* 방법·검증 (접이식) — 정책 독자에겐 부차적이라 기본은 접어 둔다 */
  /* 카드와 같은 폭·같은 안쪽 여백 — 3열 그리드 아래에서 선이 어긋나 보이지 않게 */
  details.method{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:0 18px}
  details.method>summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);
    padding:15px 0;list-style:none;display:flex;align-items:center;gap:9px}
  details.method>summary::-webkit-details-marker{display:none}
  details.method>summary::before{content:"?";display:grid;place-items:center;
    width:20px;height:20px;border-radius:50%;font-size:12px;
    background:var(--accent);color:var(--surface);flex:none}
  details.method>summary::after{content:"펼쳐보기";margin-left:auto;font-size:11.5px;
    font-weight:600;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
    border-radius:999px;padding:3px 10px}
  details.method[open]>summary::after{content:"접기"}
  details.method>summary:hover::after{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .method-body{display:grid;gap:14px;padding-bottom:16px}
  .method-body .card{box-shadow:none}

  /* pipeline */
  .pipe{grid-template-columns:repeat(2,1fr)}
  @media(max-width:760px){.pipe{grid-template-columns:1fr}}
  .step{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .step .k{font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:600}
  .step .t{font-size:13px;font-weight:700;margin:3px 0 3px}
  .step .d{font-size:11.5px;color:var(--muted);line-height:1.4}
  .step .m{font-family:var(--font-mono);font-size:11px;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums}

  .foot{max-width:1180px;margin:16px auto 6px;font-size:11.5px;color:var(--muted);line-height:1.55}
  .foot b{color:var(--ink);font-weight:700}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:5px}
  .chip.off{background:color-mix(in srgb,var(--official) 15%,transparent);color:var(--official)}
  .chip.dem{background:color-mix(in srgb,var(--demo) 16%,transparent);color:var(--demo)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      <span class="badge">시범운영</span>

  </header>

  <div class="grid">
    <section class="grid tiles" aria-label="핵심 지표">
      <div class="tile official">
        <span class="lab">이번 분기 전망</span>
        <span class="big acc mono" id="offbig"></span>
        <span class="sub" id="dirsub"></span>
      </div>
      <div class="tile">
        <span class="lab">핵심 어장</span>
        <span class="big mono" id="gndbig"></span>
      </div>
      <div class="tile demo">
        <span class="lab">어획 집중도</span>
        <span class="big dem mono" id="suitbig"></span>
        <span class="sub">어획이 몰리는 정도 · 낮을수록 어장 축소</span>
      </div>
    </section>

    <section class="grid three">
      <div class="card">
        <div class="maprow" style="margin-bottom:12px">
          <h2 style="margin:0">월별 전망</h2>
          <div class="seg" id="monseg" role="group" aria-label="월별 권역">

      </div>
      <div class="card">
        <h2>권역별 전망</h2>
        <p class="note" id="regnote"></p>
        <div class="bars" id="regbars"></div>
      </div>

      <div class="card mapbox">
          <div class="maprow stack">
            <div>
              <h2>해구별 어획량</h2>
              <p class="note" id="mapnote"></p>
            </div>
            <div class="seg" id="mapseg" role="group" aria-label="지도 보기">

   같은 표에서 19.5 와 28,023 이 섞여 읽기가 불편하다. */
const fmt = n => Math.round(n).toLocaleString('en-US');
const REGKOR = {SS:'남해',ES:'동해',WS:'서해'};

/* ---- theme ---- */
function curTheme(){
  const r=document.documentElement.getAttribute('data-theme');
  if(r) return r;
  return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
$('#themeBtn').onclick=()=>{
  const next=curTheme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  renderAll();
};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',renderAll);

/* ---- color ramps ---- */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function lerp(a,b,t){return a+(b-a)*t;}
function ramp(t,loVar,hiVar){const a=hex2rgb(cssv(loVar)),b=hex2rgb(cssv(hiVar));
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;}
function diverge(t){ // t in [-1,1]
  const mid=hex2rgb(cssv('--div-mid'));
  const pole=hex2rgb(cssv(t<0?'--div-neg':'--div-pos'));
  const k=Math.min(1,Math.abs(t));
  return `rgb(${Math.round(lerp(mid[0],pole[0],k))},${Math.round(lerp(mid[1],pole[1],k))},${Math.round(lerp(mid[2],pole[2],k))})`;}

/* ---- map ---- */
const VIEWS={

};
let view='fc';
const lons=cells.map(c=>c.lon),lats=cells.map(c=>c.lat);
const lonMin=Math.min(...lons)-.25,lonMax=Math.max(...lons)+.25;
const latMin=Math.min(...lats)-.25,latMax=Math.max(...lats)+.25;
const W=580,H=Math.round(W*(latMax-latMin)/(lonMax-lonMin));
const cw=0.5/(lonMax-lonMin)*W, chh=0.5/(latMax-latMin)*H;
const X=lon=>(lon-lonMin)/(lonMax-lonMin)*W;
const Y=lat=>(latMax-lat)/(latMax-latMin)*H;
function val(c){ return c[VIEWS[view].key]; }

/* 색 스케일은 **세 계열 공통**이어야 한다. 뷰마다 최대값으로 정규화하면 같은 색이 뷰마다
   다른 톤수를 뜻하게 되어 평년↔전년↔전망 비교가 성립하지 않는다. */
const MAPDOM=(()=>{
  const all=[];
  for(const c of cells) for(const k of ['clim5','prev','fc']) if(c[k]!=null) all.push(c[k]);
  return {mn:0, mx: all.length?Math.max(...all):1};
})();

/* 해안선 — Natural Earth 10m 을 dashboard_data.py 가 단순화해 DATA.land 로 실어준다.
   화면 밖 폴리곤은 건너뛰고, 좌표는 정수로 반올림해 path 문자열을 줄인다. */
function landPath(){
  const L=DATA.land; if(!L||!L.length) return '';
  let d='';
  for(const ring of L){
    let inView=false;
    for(const p of ring){ if(p[0]>=lonMin&&p[0]<=lonMax&&p[1]>=latMin&&p[1]<=latMax){inView=true;break;} }
    if(!inView) continue;
    d+='M'+ring.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('L')+'Z';
  }
  return d?`<path class="land" d="${d}"/>`:'';
}

function renderMap(){
  const v=VIEWS[view]; const svg=$('#map'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const mn=MAPDOM.mn, mx=MAPDOM.mx;
  let g='';
  // graticule
  for(let lon=Math.ceil(lonMin);lon<=Math.floor(lonMax);lon+=2){
    g+=`<line class="grat" x1="${X(lon)}" y1="0" x2="${X(lon)}" y2="${H}"/>`+
       `<text class="grat-t" x="${X(lon)+2}" y="${H-4}">${lon}°E</text>`;}
  for(let lat=Math.ceil(latMin);lat<=Math.floor(latMax);lat+=1){
    if(lat%1)continue;
    g+=`<line class="grat" x1="0" y1="${Y(lat)}" x2="${W}" y2="${Y(lat)}"/>`+
       `<text class="grat-t" x="3" y="${Y(lat)-2}">${lat}°N</text>`;}
  cells.forEach((c,i)=>{
    const vv=val(c); let fill;
    if(vv==null){fill='var(--surface)';}
    else{const t=mx>mn?(vv-mn)/(mx-mn):.5;fill=ramp(t,'--seq-lo','--seq-hi');}
    g+=`<rect class="cell" data-i="${i}" x="${X(c.lon)-cw/2}" y="${Y(c.lat)-chh/2}" `+
       `width="${cw*0.94}" height="${chh*0.94}" rx="1.5" fill="${fill}"/>`;
  });
  // 육지는 셀 **위에** — cartopy 도판(LAND zorder 3 > cells 2)과 같은 순서.
  // 아래에 깔면 해구 격자가 육지를 덮어 해안선이 사라진다.
  g+=landPath();
  svg.innerHTML=g;
  // legend
  const lo=$('#legLo'),hi=$('#legHi');
  $('#legUnit').textContent=v.unit;
  const bar=$('#legbar');
  bar.style.background=`linear-gradient(90deg,${cssv('--seq-lo')},${cssv('--seq-hi')})`;
  lo.textContent=fmt(mn); hi.textContent=fmt(mx);
  $('#mapnote').innerHTML=v.label;
  bindTips();
}
function bindTips(){
  const tip=$('#tip'),svg=$('#map');
  svg.querySelectorAll('rect.cell').forEach(r=>{
    r.onmousemove=e=>{
      const c=cells[+r.dataset.i]; const vv=val(c);
      const line=`평년 <b class="mono">${fmt(c.clim5)}</b> · 전년 <b class="mono">${fmt(c.prev)}</b>`
        +` · 전망 <b class="mono">${fmt(c.fc)}</b> 톤`;
      tip.innerHTML=`<b>해구 ${c.sb}</b> · ${REGKOR[c.reg]||c.reg}<br><span class="mono">${c.lon.toFixed(2)}°E ${c.lat.toFixed(2)}°N</span><br>${line}`;
      const box=svg.getBoundingClientRect(),wrap=svg.parentElement.getBoundingClientRect();
      tip.style.left=(e.clientX-wrap.left)+'px'; tip.style.top=(e.clientY-wrap.top-12)+'px';
      tip.style.opacity=1; tip.style.transform='translate(-50%,-100%)';
    };
    r.onmouseleave=()=>{tip.style.opacity=0;};
  });
}
$('#mapseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  view=b.dataset.v;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderMap();};

/* ---- 전망 비교: 최근5년 평균 · 전년 실적 · 금년 전망 ----
   이 대시보드는 모델 비교물이 아니라 대외 정보 전달물이다. 전망치는 공식 v4 월별 산출이라
   화면 합계가 분기 공식 총량과 정확히 일치한다. */
const SER=[
  {k:'clim5', lab:'평년', col:'color-mix(in srgb,var(--muted) 42%,transparent)'},
  {k:'prev',  lab:'전년',     col:'color-mix(in srgb,var(--official) 45%,transparent)'},
  {k:'fc',    lab:'금년 전망', col:'var(--official)'},
];
function outRows(){return (L.outlook&&L.outlook.rows)||[];}
function groupBars(groups, mx, headFn){
  return groups.map(g=>{
    const bars=SER.map(s=>`<div class="mrow"><span class="ml">${s.lab}</span>
      <div class="track"><div class="fill" style="width:${mx?g[s.k]/mx*100:0}%;background:${s.col}"></div></div>
      <span class="val">${fmt(g[s.k])}</span></div>`).join('');
    return `<div class="mgrp"><div class="mhead">${headFn(g)}<span class="cmp">${cmpLabel(g)}</span><span class="msp"></span></div>${bars}</div>`;
  }).join('');
}
function agg(rows, keyFn){
  const by={};
  rows.forEach(r=>{const k=keyFn(r); by[k]=by[k]||{key:k,clim5:0,prev:0,fc:0};
    SER.forEach(s=>by[k][s.k]+=r[s.k]||0);});
  return by;
}
/* 전망이 평년·전년 대비 어떤지 — 비교 대상 **막대 위에** 얹는다.
   헤더에 칩으로 띄우면 어느 막대와 비교한 값인지 눈으로 이어붙여야 해서 읽기 어렵다.
   ⚠️ 기준값이 아주 작으면(예: 2025 서해 3분기 19.5톤) 비율이 수천 %로 튀어 무의미하다.
   MIN_BASE 미만이면 % 대신 '비교 곤란'. */
const MIN_BASE=100;
function cmpLabel(g){
  const part=(base,noun)=>{
    if(!(base>0)) return '';
    /* 기준이 너무 작으면 비율 대신 **사실**을 쓴다.
       "비교 곤란"(문어투) · "의미 없음"(무엇이 의미 없는지 불명, 전망 자체를 부정하는 것처럼
       읽힐 소지) 대신 "실적 미미" — 짧고, 이유가 되고, 옆의 실제 수치와 이어진다. */
    if(base<MIN_BASE) return `<i class="mut">${noun} 실적 미미</i>`;
    const v=(g.fc/base-1)*100;
    return `<i class="${v<0?'dn':'up'}">${noun} 대비 ${v>0?'+':''}${v.toFixed(0)}%</i>`;
  };
  const s=[part(g.clim5,'평년'), part(g.prev,'전년')].filter(Boolean);
  return s.join(' / ');
}

/* 월별 */
let mreg='ALL';
function renderMon(){
  const rows=outRows().filter(r=>mreg==='ALL'||r.reg===mreg);
  if(!rows.length){$('#monbars').innerHTML='';return;}
  const by=agg(rows,r=>r.m);
  const groups=Object.values(by).sort((a,b)=>a.key-b.key);
  const mx=Math.max(...groups.flatMap(g=>SER.map(s=>g[s.k])),1);
  $('#monbars').innerHTML=groupBars(groups,mx,g=>`<b>${g.key}월</b>`);
  const tot=groups.reduce((a,g)=>({clim5:a.clim5+g.clim5,prev:a.prev+g.prev,fc:a.fc+g.fc}),
                          {clim5:0,prev:0,fc:0});
  $('#monnote').innerHTML=`${L.outlook.clim5Label} · 전년 실적 · 금년 전망 · [단위: 톤]`;
  /* 각주도 막대와 같은 MIN_BASE 규칙 — 기준이 작으면 %를 쓰지 않는다 */
  const cmp=(base,lab)=>base>=MIN_BASE
    ? `${lab} ${fmt(base)}톤 대비 <b>${((tot.fc/base-1)*100)>0?'+':''}${((tot.fc/base-1)*100).toFixed(0)}%</b>`
    : `${lab} ${fmt(base)}톤으로 실적 미미(비율 생략)`;
  $('#monfoot').innerHTML=`분기 합계 전망 <b class="mono">${fmt(tot.fc)}</b>톤 — `+
    `${cmp(tot.clim5,'평년')}, ${cmp(tot.prev,'전년')}.`;
}
$('#monseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  mreg=b.dataset.r;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderMon();};

/* 권역별 */
function renderReg(){
  const rows=outRows(); if(!rows.length){$('#regbars').innerHTML='';return;}
  const by=agg(rows,r=>r.reg);
  const order=['ES','WS','SS'];   // 분기보고서 관례
  const groups=order.filter(r=>by[r]).map(r=>by[r]);
  const mx=Math.max(...groups.flatMap(g=>SER.map(s=>g[s.k])),1);
  $('#regbars').innerHTML=groupBars(groups,mx,g=>`<b>${REGKOR[g.key]||g.key}</b>`);
}

/* ---- pipeline ---- */
/* ⚠️ 화면에 **실제로 쓰인 것만** 적는다. 이전엔 v5 실험(5계층·앙상블 WAPE·v5 총량)을 적어 뒀는데,
   화면의 전망치는 v5 가 아니라 운영모델 산출이라 "AI가 이 숫자를 냈다"로 오독될 수 있었다. */
const PIPE=[
  ['어획량 전망','분기 · 월별 · 권역별',
   '조업규제 캘린더로 조업일수를 잡고, 최근 3년 같은 달 어획효율을 곱해 산출합니다. 유가·기상특보로 조업일수를 보정합니다.',
   `2013–25년 검증 · 분기 증감 방향 적중률 ${DATA.kpi1.v4}`],
  ['해구별 분포','어디에 몰리나',
   '수온·해면높이·클로로필 등 해양환경으로 해구마다 어획이 집중되는 정도를 AI(종분포모형)가 판정하고, 권역 전망을 그 비율로 나눕니다.',
   `출현 판별 AUC ${DATA.auc.envgeo} · 환경 순수기여 +${((DATA.auc.envgeo-DATA.auc.clim)*100).toFixed(1)}pt`],
];
$('#pipe').innerHTML=PIPE.map(p=>`<div class="step"><div class="k">${p[0]}</div>
  <div class="t">${p[1]}</div><div class="d">${p[2]}</div><div class="m">${p[3]}</div></div>`).join('')
  +`<p class="vbar-note" style="grid-column:1/-1;margin-top:2px">
     지도는 <b>어획이 집중되는 곳</b>을 나타냅니다. 관측 대조에서 어획량(+0.75)·조업일수(+0.77)와는
     잘 맞지만 <b>단위 노력당 어획효율(CPUE)과는 무관</b>(−0.32)하므로, 효율이 높은 어장으로 읽으면 안 됩니다.
     또 판정력의 대부분은 예년의 어장 분포에서 오고 해양환경은 소폭 가산합니다.</p>`;

/* ---- tiles · 분기 문구 (전부 DATA.labels 에서 — HTML 에 하드코딩 금지) ----
   ⚠️ 요소를 지우고 이 블록의 참조를 안 지우면 TypeError 로 **스크립트 전체가 죽어** 화면이
   통째로 빈다(콘솔에도 안 남을 수 있음). set() 으로 감싸 한 곳이 없어도 나머지는 그린다. */
const set=(sel,html)=>{const e=$(sel); if(e) e.innerHTML=html;};
const TON='<span style="font-size:14px"> 톤</span>';
set('#qtitle', L.title||'');
if(DATA.logo){const lg=$('#logo'); lg.src=DATA.logo; lg.hidden=false;}
set('#sbcount', DATA.meta.nSeablock);
set('#offbig',(L.officialFmt||'—')+TON);
set('#suitbig',(L.suitChangePct==null)?'—'
  :`<span style="font-size:13px;font-weight:600">평년 대비 </span>${L.suitChangePct>0?'+':''}${L.suitChangePct}%`);
set('#dirsub',[
  L.yoyPct==null?'':`전년비 <b>${L.yoyPct>0?'+':''}${L.yoyPct}%</b>`,
  L.clim5Pct==null?'':`평년비 <b>${L.clim5Pct>0?'+':''}${L.clim5Pct}%</b>`
].filter(Boolean).join(' · '));
set('#gndbig',(L.zones&&L.zones.length)
  ? L.zones.map((z,i)=>`<span class="gz">${i+1}. ${z}</span>`).join('')
  : (L.ground||'—'));
/* 버튼은 짧게 — 분기는 헤더 부제가 이미 밝힌다 */
set('#btnfc','금년 전망');


$('#regnote').textContent=(L.outlook&&L.outlook.clim5Label)?
  `${L.outlook.clim5Label} · 전년 실적 · 금년 전망 · [단위: 톤]`:'';
function renderAll(){renderMap();renderMon();renderReg();}
renderAll();
</script>
