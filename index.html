const progressRules='90~100% 근접 · 100% 초과~150% 초과 · 150% 초과 큰 폭 초과. 분산조업 후보는 누적 50% 이하, 분기 중반 이후, 최근 7일 이내 어획 확인을 모두 충족한 곳입니다.';

const sizeNames=O.lengthReference?{small:`${O.lengthReference.lowerCm}cm 미만`,middle:`${O.lengthReference.lowerCm}~${O.lengthReference.upperCm}cm`,large:`${O.lengthReference.upperCm}cm 초과`}:{};
const sizeColor=k=>({small:hasTheme()==='dark'?'#725629':'#f4d291',middle:hasTheme()==='dark'?'#386163':'#b8d8d5',large:hasTheme()==='dark'?'#345f8a':'#9fc3e7'}[k]||'var(--line)');
const lengthBasis=()=>O.lengthReference?`${O.lengthReference.years.join('·')}년 ${O.lengthReference.quarterNumber}분기 측정표본 ${O.lengthReference.n.toLocaleString()}마리의 25·75백분위`:'과거 같은 분기의 기준 표본 없음';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const forecastRanges=['','0% 초과~25% 이하','25% 초과~50% 이하','50% 초과~75% 이하','75% 초과~100% 이하'];

const forecastBasis=(c,k)=>c[k]==null?'비교할 분포 자료가 없습니다.':c[k]===0?(k==='fc'?'배분 하한 적용 등으로 전망 분포가 표시되지 않습니다. 어획 불가능 판정이 아닙니다.':'집계된 어획량이 0·미확보이거나 매우 작아 분포가 표시되지 않습니다. 현재 자료만으로 그 원인을 구분할 수 없습니다.'):`${seriesNames[k]} 최대 해역 대비 ${(c[k]*100).toFixed(1)}% → ${forecastRanges[level(c[k])]} 구간`;
function progressBasis(pg,ob,w){
 const r=O.guidanceRules||{},p=pg.percent;
 if(p==null)return progressAdvice[pg.status];
 const fraction=`같은 해역의 분기 누적 실적 ÷ 분기 예측량 × 100 = ${p.toFixed(1)}%`;
 const band=pg.status==='candidate'?`50% 이하이며 ${r.midpointDate} 이후·최근 7일 양수 어획 기록 조건을 모두 충족했습니다.`:pg.status==='near'?'90% 이상~100% 이하 구간입니다.':pg.status==='excess'?'100% 초과~150% 이하 구간입니다.':pg.status==='large_excess'?'150% 초과 구간입니다.':p>50?'50% 초과~90% 미만으로, 근접·초과와 분산 검토 조건에 해당하지 않습니다.':`50% 이하이지만 ${w?.end<r.midpointDate?'분기 중반 이전이므로':'최근 7일 양수 어획 기록이 없어'} 분산 검토 후보로 표시하지 않습니다.`;
 return fraction+'<br>'+band;
}
function renderCriteria(){
 const yr=Number((L.quarter||'').slice(0,4)),r=O.guidanceRules||{},ref=O.lengthReference;
 const section=(id,title,html)=>`<details ${id===(tab==='forecast'?'forecast':currentView)?'open':''}><summary>${title}</summary>${html}</details>`;
 const forecast=criteriaTable([['낮음','최대 어획 해역 대비 0% 초과~25% 이하'],['중간','25% 초과~50% 이하'],['높음','50% 초과~75% 이하'],['매우 높음','75% 초과~100% 이하'],['분포 미표시','저장된 상대값이 0인 곳. 아래의 전망·과거 자료 처리 방식에 따라 발생하며, 물고기가 없거나 조업할 수 없다는 의미가 아닙니다.'],['자료 없음','비교할 해당 계열의 분포값 자체가 없는 곳.']])+`<h4>어떤 값과 비교하나요?</h4><p>각 해역의 어획량을 그 시기의 최대 해역 어획량으로 나눕니다. 상대값을 소수 셋째 자리로 반올림한 뒤 네 구간으로 표시합니다. 상위 25% 해역을 뜻하는 순위가 아닙니다. 시기마다 최대값이 달라 같은 색이 같은 톤수를 뜻하지 않습니다.</p><h4>전망과 과거 자료의 산출 근거</h4><p>금년 전망은 권역 어획량 전망을 해구별 예측 어획 집중도 비중으로 나눠 배분한 뒤 1도 격자로 합친 값입니다. 배분 전에 권역 내 비중이 2% 미만인 해구는 0으로 두고 나머지에 재배분합니다. 따라서 격자 전체가 배분에서 제외되면 분포를 표시하지 않습니다. 양수라도 상대값 반올림으로 0이 될 수 있습니다.</p><p>평년은 ${esc(L.outlook?.clim5Label||'최근 5년 같은 분기 평균')}, 전년은 ${yr-1}년 같은 분기의 어획 집계입니다. 과거 집계의 미확보값도 생성 과정에서 0으로 채웠으므로 빈칸만으로 실제 무어획과 자료 미확보를 구분할 수 없습니다.</p><p>네 등분 색 구간과 2% 배분 하한은 기존 앱의 표현·배분 설정입니다. 자원 상태나 지속가능 어획량을 판정하는 검증된 기준이 아닙니다. 특히 2% 하한은 모든 해구에 작은 값이 퍼지는 것을 줄이기 위한 설정입니다.</p><h4>상단 전망 수치</h4><p>분기 전체 전망은 천 톤 단위로 반올림해 ‘내외’로 표시합니다. 평년·전년 대비는 (분기 전망 ÷ 비교 어획량 − 1) × 100이며 상단에서는 5%p 단위로 반올림합니다. 지도 색의 기준과 별개입니다.</p>`;
 const progress=criteriaTable([['분산조업 검토 후보','진행률 50% 이하 + 분기 중반 이후 + 선택 주간 마지막 날까지 최근 7일 안에 양수 어획 기록. 세 조건 모두 충족.'],['일반','진행률 90% 미만 중 분산조업 후보 조건을 충족하지 않는 곳. 안전·적정 어획 판정은 아닙니다.'],['전망치 근접','진행률 90% 이상~100% 이하'],['전망치 초과','100% 초과~150% 이하'],['전망치 큰 폭 초과','150% 초과'],['어획 기록 없음','해당 분기·해역의 누적 기록이 없음. 실제 어획 0으로 대체하지 않습니다.'],['비교할 전망값 없음','누적 어획 기록은 있으나 분기 배분 전망이 0이거나 미확보. 진행률을 계산하지 않습니다.'],['어획 확인 / 어획 0으로 보고','선택 주간 어획 기록의 합이 양수 / 기록은 있으나 합이 0.'],['최근 7일 확인 / 미확인','선택 주간 마지막 날을 포함한 7일 안에 양수 어획 기록이 있는지 확인합니다. 기록이 없어도 실제 조업 여부를 단정하지 않습니다.']])+`<h4>계산과 자료 근거</h4><p>진행률 = 같은 1도 격자의 분기 시작~선택 주간 말 누적 어획량 ÷ 그 분기 예측 어획량 × 100. 소수 첫째 자리로 반올림한 값으로 판정합니다. 어획 관측은 ${esc(O.catchSource||'미연결')}이며 배분 전망은 전망 지도와 같은 내부 산출값입니다. 격자별 절대 톤수는 공개하지 않습니다.</p><p>이번 분기의 중반 날짜는 ${esc(r.midpointDate||'미설정')}입니다. 과거 주차를 선택하면 당시까지의 기록만 사용합니다. 최근 기록 판정은 오늘이 아니라 선택 주간 말 기준이며 자료가 자동으로 실시간 수신되는 것은 아닙니다.</p><h4>왜 이 기준인가요?</h4><p>90·100·150%와 50%, 분기 중반·최근 7일 조건은 이번 시범서비스에서 정한 운영 기준입니다. 과학적으로 검증된 과도 어획·자원 고갈 기준이 아닙니다. 분기 초의 낮은 누적량과 오래된 어획 기록만으로 분산조업을 추천하는 일을 줄이기 위해 후보 조건을 함께 적용했습니다.</p><p>전망 초과에는 조업 집중과 예측 오차가 함께 영향을 줄 수 있습니다. 파랑은 비교·검토할 후보이며 어획 가능성이나 체장 적합성을 보장하지 않습니다.</p><h4>상단 집계 범위</h4><p>주간·분기 누적 톤수는 수집된 대형선망 고등어 기록의 합으로, 표시할 때 톤 단위로 반올림합니다. 분산 검토·근접·초과의 ‘곳’은 지도 범위의 1도 격자 수입니다. 전체 톤수에는 위치 미확정 기록도 포함될 수 있습니다.</p>`;
 const length=criteriaTable(ref?[[sizeNames.small,`판정용 중앙체장 ${ref.lowerCm.toFixed(1)}cm 미만`],[sizeNames.middle,`${ref.lowerCm.toFixed(1)}cm 이상~${ref.upperCm.toFixed(1)}cm 이하`],[sizeNames.large,`${ref.upperCm.toFixed(1)}cm 초과`],['선택 주간 관측','선택한 월요일~일요일 주간에 측정된 표본이 있음.'],['과거 관측 · 점선','선택 주간에 표본이 없어 그 이전의 가장 최근 조사 주간 표본을 표시함.'],['측정자료 없음','선택 주간까지 해당 해역에서 유효한 FL 측정값이 한 개도 없음.'],['체장 기준 없음','표본은 있으나 과거 기준 자료가 없거나 25·75백분위가 같아 크기 분류를 하지 않음.']]:[['체장 기준 없음','과거 같은 분기의 유효한 크기 기준을 만들 수 없어 평균·중앙값 등 관측만 표시합니다.']])+`<h4>기준 자료와 판정 방법</h4><p>${lengthBasis()}. 이 기준 표본의 작은 쪽 25% 경계와 큰 쪽 25% 경계를 사용합니다. 과거 5년 같은 분기 표본을 개체 단위로 합치므로 표본이 많은 연도·해역의 영향이 큽니다.</p><p>지도 색은 최근 조사 주간 표본의 반올림 전 중앙값으로 결정합니다. 상세의 크기별 비율은 각 구간에 속한 실제 표본 수 ÷ 전체 표본 수입니다. 평균 체장으로 비율을 추정하지 않습니다. 상세에 판정용 중앙값을 별도로 제시합니다.</p><p>이 체장 구간은 과거 측정 분포를 기준으로 나눈 것이며 생물학적 미성어·성어 판정이 아닙니다. 자료가 한 개라도 있으면 날짜와 함께 표시하지만 해역 전체를 대표한다고 판단하지는 않습니다.</p><h4>표본과 날짜</h4><p>체장 자료는 ${esc(O.lengthSource||'미연결')}. 0 이하·비수치 값은 제외합니다. ‘조사일 수’는 서로 다른 조사 날짜 수로, 독립 조업 횟수가 아닙니다. 히스토그램은 2cm 간격, 하한 포함·상한 제외입니다. 평균·중앙체장은 소수 첫째 자리, 비율은 소수 첫째 자리로 표시합니다.</p>`;
 $('#criteriaContent').innerHTML=section('forecast','전망 · 색과 분포 미표시',forecast)+section('progress','현황 · 어획 진행과 조업 참고',progress)+section('length','현황 · 체장 크기와 관측 상태',length);
}

  }else{
    $('#summary').innerHTML=`<div><div class="summary-label">체장 관측이 있는 해역</div><strong>${cells.filter(c=>lengthObs(cellObs(c))).length}<small>곳</small></strong></div><div class="secondary"><div class="summary-label">선택 주간 신규 표본</div><strong>${(w?.lengthN??0).toLocaleString()}마리</strong><div class="desc">과거 관측은 날짜를 함께 표시</div></div>`;
  }
  const options=tab==='forecast'?[['clim5','평년'],['prev','전년'],['fc','금년 전망']]:[['progress','어획'],['length','체장']];
  $('#mapseg').innerHTML=options.map(([v,label])=>`<button data-view="${v}" aria-pressed="${v===(tab==='forecast'?view:currentView)}">${label}</button>`).join('');
  $('#mapseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(tab==='forecast')view=b.dataset.view;else currentView=b.dataset.view;render();};
  $('#mapTitle').textContent=tab==='forecast'?'어획량 분포 전망':currentView==='progress'?'전망 대비 누적 어획':'관측 체장 (cm)';
  $('#mapScope').textContent=tab==='forecast'?'1도 격자의 상대등급이며 CPUE·자원밀도·절대어획량을 의미하지 않습니다. 각 시기 안의 상대적 집중 정도입니다.':currentView==='progress'?'색은 전망 대비 누적 어획 상태입니다. 해역을 누르면 주간 어획 기록과 분산조업 검토 정보를 함께 볼 수 있습니다.':'숫자는 측정 표본 체장의 중앙값, 색은 체장 구간입니다. 선택 주간까지의 가장 최근 조사 주간을 표시하며, 과거 관측은 점선으로 구분합니다.';
}
function renderMap(){
  if(!cells.length)return;
  const x0=Math.min(...cells.map(c=>c.lon))-.65,x1=Math.max(...cells.map(c=>c.lon))+.65;
  const y0=Math.min(...cells.map(c=>c.lat))-.65,y1=Math.max(...cells.map(c=>c.lat))+.65;
  const W=800,H=Math.round(W*(y1-y0)/(x1-x0)),X=x=>(x-x0)/(x1-x0)*W,Y=y=>(y1-y)/(y1-y0)*H;
  const dx=W/(x1-x0),dy=H/(y1-y0),palette=colors();
  const svg=$('#map');svg.setAttribute('aria-label',tab==='current'?(currentView==='progress'?'1도 격자 어획 진행 지도':'1도 격자 관측 체장 지도'):'1도 격자 상대등급 어획량 분포 지도');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let html='',marks='';for(let x=Math.ceil(x0);x<=x1;x++)html+=`<line class="grat" x1="${X(x)}" x2="${X(x)}" y1="0" y2="${H}"/>`;
  for(let y=Math.ceil(y0);y<=y1;y++)html+=`<line class="grat" y1="${Y(y)}" y2="${Y(y)}" x1="0" x2="${W}"/>`;
  cells.forEach(c=>{const ob=cellObs(c),v=forecastLevel(c);
    const sample=lengthObs(ob),sampled=!!sample,pg=progressOf(ob),isProgress=tab==='current'&&currentView==='progress',isLength=tab==='current'&&currentView==='length',missing=isProgress?pg.percent==null:isLength?!sampled:v==null;
    const fill=isProgress?progressColor(pg.status):isLength?(sampled?sizeColor(sample.sizeClass):'var(--surface)'):missing?'var(--surface)':palette[v];
    html+=`<rect class="cell ${selected===key(c)?'selected':''}" data-key="${key(c)}" x="${X(c.lon)-dx*.47}" y="${Y(c.lat)-dy*.47}" width="${dx*.94}" height="${dy*.94}" rx="3" stroke-dasharray="${isLength&&sampled&&!ob?.length?'5 3':'none'}" fill="${fill}" fill-opacity="${missing?.52:1}"><title>${cellName(c)} · ${isProgress?progressNames[pg.status]+(pg.percent==null?'':' · '+pg.percent.toFixed(1)+'%'):isLength?(sampled?(ob?.length?'선택 주간 관측':'과거 관측')+' · '+(sizeNames[sample.sizeClass]||'체장 기준 없음'):'측정자료 없음'):forecastLabel(c,view)}</title></rect>`;
    if(tab==='current')marks+=`<text class="mark" text-anchor="middle" x="${X(c.lon)}" y="${Y(c.lat)+6}">${isProgress?progressMarks[pg.status]:sampled?sample.medianCm.toFixed(1):'—'}</text>`;
  });
  html+=(DATA.land||[]).map(r=>`<path class="land" d="M${r.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('L')}Z"/>`).join('');
  html+=marks;
  html+=`<text class="place" text-anchor="middle" x="${X(127.7)}" y="${Y(36.1)}">대한민국</text><text class="place" x="${X(129.9)}" y="${Y(32)}">일본</text>`;
  svg.innerHTML=html;svg.querySelectorAll('.place').forEach(t=>t.style.fontSize=`${Math.max(19,12*W/(svg.clientWidth||W))}px`);
  svg.onclick=e=>{const r=e.target.closest('[data-key]');if(r){selected=r.dataset.key;renderMap();renderDetail();}};
  $('#gridSelect').value=selected;
  const showEmpty=tab!=='forecast'&&!currentWeek();$('#mapEmpty').hidden=!showEmpty;$('#mapEmpty').textContent='이 분기에 연결된 관측자료가 없습니다.';
  $('#legend').innerHTML=tab==='current'&&currentView==='progress'?['candidate','normal','near','excess','large_excess'].map(k=>`<span><i class="swatch" style="--c:${progressColor(k)}"></i>${progressNames[k]}</span>`).join('')+'<span>— 어획 기록 없음 · ? 비교 전망 없음</span>':tab==='current'?Object.entries(sizeNames).map(([k,n])=>`<span><i class="swatch" style="--c:${sizeColor(k)}"></i>${n}</span>`).join('')+'<span>숫자: 중앙체장(cm) · 점선: 과거 관측 · —: 자료 없음</span>':palette.slice(1).map((c,i)=>`<span><i class="swatch" style="--c:${c}"></i>${levelNames[i+1]}</span>`).join('')+'<span>빈칸: '+(tab==='forecast'?'분포 미표시 또는 자료 없음':'기록 없음')+'</span>';
}
function renderDetail(){
  const c=allCells.get(selected),w=currentWeek();if(!c)return;
  const ob=cellObs(c);
  if(tab==='forecast'){
    const rows=['clim5','prev','fc'].map(k=>`${metric(seriesNames[k],forecastLabel(c,k))}<p class="basis">${forecastBasis(c,k)}</p>`).join('');
    $('#detailBody').innerHTML=`<span class="status">분포 전망</span><h4>선택 해역의 어획 분포</h4>${rows}<div class="notice">각 시기의 최대 어획 해역을 100%로 비교합니다. 낮음·높음은 자원량이나 조업 안전성 판단이 아닙니다.</div><button class="criteria-button" data-show-criteria>표시 기준·판단 근거 보기</button>`;
  }else if(currentView==='progress'){
    const pg=progressOf(ob),rules=O.guidanceRules||{},early=w?.end<rules.midpointDate;
    const record=ob?.catchLevel==null?'기록 없음':ob.catchLevel===0?'어획 0으로 보고':'어획 확인';
    const waiting=pg.status==='normal'&&pg.percent<=50?(early?'분산조업 후보 표시는 분기 중반('+esc(rules.midpointDate)+')부터 시작합니다.':'최근 7일 이내의 양수 어획 기록이 없어 분산조업 후보로 표시하지 않습니다.'):'';
    $('#detailBody').innerHTML=`<span class="status ${pg.percent==null?'missing':''}">${progressNames[pg.status]}</span><h4>${pg.percent==null?'진행률 판단 보류':'전망 대비 누적 '+pg.percent.toFixed(1)+'%'}</h4><p>${progressAdvice[pg.status]}</p>${metric('선택 주간',spanDates(w))}${metric('선택 주간 어획 기록',record)}${metric('마지막 어획 기록일',esc(ob?.lastCatchDate||'없음'))}${metric('최근 7일 어획 확인',ob?.recentCatch?'확인':'미확인')}<div class="notice"><strong>이 표시가 나온 근거</strong><br>${progressBasis(pg,ob,w)}<br>${waiting?waiting+'<br>':''}예측량은 어획 허용량이나 자원량이 아닙니다. 초과에는 조업 집중과 예측 오차가 함께 영향을 줄 수 있습니다.</div><button class="criteria-button" data-show-criteria>표시 기준·판단 근거 보기</button><div class="notice">${lengthObs(ob)?'체장 보기에서 '+esc(lengthObs(ob).lastDate)+' 관측과 표본 수를 확인하세요. 오래된 관측만으로 현재 조업 여건을 판단하지 않습니다.':'이 격자는 체장 측정자료가 없습니다. 체장 조건을 확인한 추천이 아닙니다.'}<br>수집된 자료 기준의 참고정보이며 전체 조업의 완전 집계를 보장하지 않습니다.</div>`;
  }else{
    const s=lengthObs(ob);
    if(!s){
      $('#detailBody').innerHTML=`<span class="status missing">측정자료 없음</span><h4>체장 판단을 보류합니다</h4><p>선택한 주간까지 이 격자의 체장 측정자료가 없습니다. 소형어가 적거나 조업하기에 안전하다는 의미는 아닙니다.</p>${metric('이 주까지 마지막 조사',ob?.lastLengthDate?dateShort(ob.lastLengthDate):'관측 없음')}<div class="notice">한 번이라도 측정자료가 확보되면 체장·분포·표본 수와 조사일을 표시합니다.</div>`;
    }else{
      const max=Math.max(...s.hist.map(h=>h.n)),med=s.classificationMedianCm??s.medianCm;
      const medText=Number(med.toFixed(3)).toString();
      $('#detailBody').innerHTML=`<span class="status ${ob?.length?'':'missing'}">${ob?.length?'선택 주간 관측':'과거 관측'} · ${sizeNames[s.sizeClass]||'체장 기준 없음'}</span><h4>중앙체장 ${s.medianCm.toFixed(1)} cm</h4><p>가랑이체장(FL) · 측정한 고등어 기준</p>${s.sizeClass?`<div class="notice"><strong>이 표시가 나온 근거</strong><br>판정용 중앙값 ${medText}cm → ${sizeNames[s.sizeClass]} (${s.sizeClass==='small'?O.lengthReference.lowerCm+'cm 미만':s.sizeClass==='large'?O.lengthReference.upperCm+'cm 초과':O.lengthReference.lowerCm+'~'+O.lengthReference.upperCm+'cm 범위'})</div>`:''}${metric('평균 체장',s.meanCm.toFixed(1)+' cm')}${metric('표본 수 / 조사일 수',`${s.n.toLocaleString()}마리 / ${s.days}일`)}${metric('관측 기간',dateShort(s.firstDate)+'–'+dateShort(s.lastDate))}${metric('마지막 조사일',esc(s.lastDate))}${s.sizeCounts?Object.entries(s.sizeCounts).map(([k,n])=>metric(sizeNames[k],(n/s.n*100).toFixed(1)+'% ('+n+'마리)')).join(''):''}<div class="notice">${O.lengthReference?`체장 구간: ${O.lengthReference.lowerCm}cm 미만 / ${O.lengthReference.lowerCm}~${O.lengthReference.upperCm}cm / ${O.lengthReference.upperCm}cm 초과. ${lengthBasis()}.`:lengthBasis()}<br>미성어 또는 성어 판정 기준이 아닙니다.${!ob?.length?' 과거 자료의 관측일을 확인하세요.':''}</div><div class="mini-title">체장 분포 <span class="desc">(cm · 마리)</span></div>${s.hist.map(h=>`<div class="hist-row"><span>${h.from}–${h.from+2}</span><div class="hist-track"><i style="width:${h.n/max*100}%"></i></div><span>${h.n}</span></div>`).join('')}<div class="notice">각 구간은 하한 이상·상한 미만입니다. 측정 표본의 분포이며 이 해역 전체의 체장 구성을 확정하지 않습니다. 1개 표본부터 표시하며 최소 표본 수나 경과일로 숨기지 않습니다.</div><button class="criteria-button" data-show-criteria>표시 기준·판단 근거 보기</button>`;
    }
  }
}
function renderTables(){
  const rows=L.outlook?.rows||[];
  function table(key,order,names){const groups=order.map(k=>({label:names[k],rows:rows.filter(r=>r[key]===k)}));return `<table class="detail-table"><thead><tr><th>구분</th><th>평년</th><th>전년</th><th>전망</th></tr></thead><tbody>${groups.map(g=>`<tr><th>${g.label}</th>${['clim5','prev','fc'].map(k=>`<td>${g.rows.length?fmt(g.rows.reduce((s,r)=>s+r[k],0)):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
  $('#forecastTable').innerHTML='<p>단위: 천 톤 · '+esc(L.outlook?.clim5Label||'')+'</p>'+table('m',L.months||[],Object.fromEntries((L.months||[]).map(m=>[m,m+'월'])))+table('reg',['ES','WS','SS'],{ES:'동해',WS:'서해',SS:'남해'});
  const s=DATA.sizeForecast,card=$('#sizeCard');
  if(!s||s.quarter!==L.quarter||!Array.isArray(s.rows)||!['ES','WS','SS'].every(r=>s.rows.some(x=>x.region===r&&Number.isFinite(x.forecastCm)))){card.hidden=true;return;}
  $('#sizeTitle').textContent=s.title;$('#sizeGrid').innerHTML=s.rows.map(r=>metric(esc({ES:'동해',WS:'서해',SS:'남해',전체:'전체'}[r.region]||r.region),`${r.forecastCm.toFixed(1)} cm${r.nMonths<3?' · '+r.nMonths+'/3개월':''}${r.vsClimPct==null?'':' · 평년 대비 '+(r.vsClimPct>0?'+':'')+r.vsClimPct.toFixed(1)+'%'}`)).join('');$('#sizeNote').textContent=s.caution||'';card.hidden=false;
}
function render(){renderSummary();renderMap();renderDetail();
  $('#sourceInfo').innerHTML=`<p>전망: ${esc(L.title||L.quarter)} · 평년/전년/전망은 각 시기 최대값으로 표준화한 상대등급입니다.</p><p>어획 관측: ${esc(O.catchSource||'자료 미연결')}<br>마지막 기록 ${esc(O.catchLastDate||'없음')}</p><p>체장 관측: ${esc(O.lengthSource||'자료 미연결')}<br>마지막 조사 ${esc(O.lengthHistoryLastDate||O.lengthLastDate||'없음')}</p><p>어획 진행 기준: ${progressRules} 진행률은 소수 첫째 자리로 반올림해 판정합니다. 분기 중반은 ${esc(O.guidanceRules?.midpointDate||'미설정')}이며, 최근 어획 여부는 선택 주간 마지막 날 기준입니다. 예측량은 어획 허용량이나 남은 자원량이 아닙니다.</p><p>체장 크기 기준: ${lengthBasis()}. 자료가 한 번이라도 있으면 최근 조사 주간의 측정값을 표시하고, 선택 주간 신규 자료와 과거 자료를 구분합니다.</p><p>주간은 월요일–일요일이며 분기 경계에서는 분기 안의 날짜만 집계합니다. 마지막 기록일은 수집 완료일이 아닙니다. 관측은 주간 단위로 갱신합니다. 새 수신자료로 관측 집계를 갱신하면 화면에 반영됩니다.</p><p>지도는 전망 격자 범위에 한정합니다. 범위 밖·위치 미확정 자료는 지도에 표시하지 않습니다. 해당 주 위치 미확정 어획 ${ton(currentWeek()?.unlocatedCatchTon)}톤, 체장 ${currentWeek()?.unlocatedLengthN??0}마리.</p>`;
}
if(DATA.logo){$('#logo').src=DATA.logo;$('#logo').hidden=false;}
renderTables();render();
</script>
